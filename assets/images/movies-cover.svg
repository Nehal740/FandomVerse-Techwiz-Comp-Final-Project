<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="mbg" cx="50%" cy="30%" r="80%">
    <stop offset="0%" stop-color="#241246"/>
    <stop offset="60%" stop-color="#0D1220"/>
    <stop offset="100%" stop-color="#050308"/>
  </radialGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F59E0B" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="beam2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00E5FF" stop-opacity=".4"/>
    <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect width="900" height="600" fill="url(#mbg)"/>

<!-- projector light beams -->
<polygon points="70,40 830,40 640,470 260,470" fill="url(#beam)"/>
<polygon points="180,40 720,40 590,430 310,430" fill="url(#beam2)" opacity=".5"/>

<!-- film strip borders top and bottom -->
<g fill="#000">
  <rect x="0" y="0" width="900" height="46"/>
  <rect x="0" y="554" width="900" height="46"/>
</g>
<g fill="#F8FAFC" opacity=".85">
  <g id="sprocketRow">
    <rect x="10" y="14" width="18" height="18" rx="3"/>
    <rect x="60" y="14" width="18" height="18" rx="3"/>
    <rect x="110" y="14" width="18" height="18" rx="3"/>
    <rect x="160" y="14" width="18" height="18" rx="3"/>
    <rect x="210" y="14" width="18" height="18" rx="3"/>
    <rect x="260" y="14" width="18" height="18" rx="3"/>
    <rect x="310" y="14" width="18" height="18" rx="3"/>
    <rect x="360" y="14" width="18" height="18" rx="3"/>
    <rect x="410" y="14" width="18" height="18" rx="3"/>
    <rect x="460" y="14" width="18" height="18" rx="3"/>
    <rect x="510" y="14" width="18" height="18" rx="3"/>
    <rect x="560" y="14" width="18" height="18" rx="3"/>
    <rect x="610" y="14" width="18" height="18" rx="3"/>
    <rect x="660" y="14" width="18" height="18" rx="3"/>
    <rect x="710" y="14" width="18" height="18" rx="3"/>
    <rect x="760" y="14" width="18" height="18" rx="3"/>
    <rect x="810" y="14" width="18" height="18" rx="3"/>
    <rect x="860" y="14" width="18" height="18" rx="3"/>
  </g>
  <use href="#sprocketRow" y="540"/>
</g>

<!-- clapperboard, generic (no text) -->
<g transform="translate(150,330)">
  <rect x="-90" y="20" width="220" height="140" rx="8" fill="#1b1240" stroke="#8B5CF6" stroke-width="6"/>
  <g stroke="#F8FAFC" stroke-width="10">
    <line x1="-90" y1="55" x2="130" y2="55"/>
    <line x1="-90" y1="85" x2="130" y2="85"/>
  </g>
  <g transform="translate(-90,-10) rotate(-14)">
    <rect x="0" y="0" width="220" height="34" rx="6" fill="#0D1220" stroke="#00E5FF" stroke-width="6"/>
    <g fill="#F8FAFC">
      <polygon points="10,0 40,0 25,34 -5,34"/>
      <polygon points="55,0 85,0 70,34 40,34"/>
      <polygon points="100,0 130,0 115,34 85,34"/>
      <polygon points="145,0 175,0 160,34 130,34"/>
    </g>
  </g>
</g>

<!-- film reel -->
<g transform="translate(650,300)">
  <circle r="120" fill="none" stroke="#FF3CAC" stroke-width="10"/>
  <circle r="26" fill="#0D1220" stroke="#F8FAFC" stroke-width="6"/>
  <g fill="#0D1220" stroke="#F8FAFC" stroke-width="5">
    <circle cx="0" cy="-70" r="24"/>
    <circle cx="61" cy="-35" r="24"/>
    <circle cx="61" cy="35" r="24"/>
    <circle cx="0" cy="70" r="24"/>
    <circle cx="-61" cy="35" r="24"/>
    <circle cx="-61" cy="-35" r="24"/>
  </g>
</g>

<!-- cinema seat row silhouette -->
<g transform="translate(0,470)" fill="#050308" opacity=".9">
  <rect x="0" y="20" width="900" height="90"/>
  <g fill="#0D1220">
    <rect x="30" y="0" width="60" height="40" rx="8"/>
    <rect x="140" y="0" width="60" height="40" rx="8"/>
    <rect x="250" y="0" width="60" height="40" rx="8"/>
    <rect x="360" y="0" width="60" height="40" rx="8"/>
    <rect x="470" y="0" width="60" height="40" rx="8"/>
    <rect x="580" y="0" width="60" height="40" rx="8"/>
    <rect x="690" y="0" width="60" height="40" rx="8"/>
    <rect x="800" y="0" width="60" height="40" rx="8"/>
  </g>
</g>
</svg>
